# render.yaml - Render Blueprint Configuration
services:
  # Backend API Service
  - type: web
    name: smail-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smail-db
          property: connectionString
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: smail-frontend
    env: static
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://smail-api.onrender.com/api

# Database
databases:
  - name: smail-db
    databaseName: smail
    user: smail
    region: oregon
    plan: free
    ipAllowList: []